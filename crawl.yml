name: Daily Price Crawl

on:
  schedule:
    # UTC 기준 매일 00:00 = 한국 시간(KST) 매일 09:00
    - cron: '0 0 * * *'
  # 필요할 때 수동으로 즉시 실행할 수 있는 버튼 활성화
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: |
          pip install requests beautifulsoup4 gspread oauth2client

      - name: 크롤러 실행
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python crawler.py