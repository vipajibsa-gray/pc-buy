name: Daily Price Crawl

on:
  schedule:
    # UTC 00:00 = 한국 시간(KST) 매일 아침 09:00 실행
    - cron: '0 0 * * *'
  # GitHub 사이트에서 'Run workflow' 버튼으로 언제든 즉시 실행 가능
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install requests beautifulsoup4

      - name: 크롤러 실행
        run: |
          python crawler.py
